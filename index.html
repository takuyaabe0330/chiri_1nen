      font-size: 15px;
      line-height: 1.4;

      text-align: left;

    .btn:hover {

      color: #fff;
    }
    .btn-primary {

      color: #fff;
      text-align: center;
      font-weight: bold;
      border: none;

    .correct-btn {

      color: white !important;

      currentQuestionIndex = 0;
      score = 0;
      
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      
      showQuestion();
    }

    function showQuestion() {
      isAnswered = false;
      document.getElementById('explanation-box').classList.add('hidden');
      
      const q = currentQuestions[currentQuestionIndex];
      document.getElementById('progress').innerText = `問題 ${currentQuestionIndex + 1} / ${currentQuestions.length} 【${q.unit}】`;
      document.getElementById('question-text').innerText = q.question;
      
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';
      
      q.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = option;
        btn.onclick = () => checkAnswer(index, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIndex, selectedBtn) {
      if (isAnswered) return;
      isAnswered = true;
      
      const q = currentQuestions[currentQuestionIndex];
      const buttons = document.getElementById('options-container').querySelectorAll('button');
      
      buttons.forEach((btn, index) => {
        btn.disabled = true;
        if (index === q.answerIndex) {
          btn.classList.add('correct-btn');
        } else if (index === selectedIndex) {
          btn.classList.add('wrong-btn');
        }
      });

      const title = document.getElementById('result-title');
      if (selectedIndex === q.answerIndex) {
        title.innerText = "⭕ 正解！";
        title.style.color = "#2e7d32";
        score++;
      } else {
        title.innerText = "❌ 不正解...";
        title.style.color = "#d32f2f";
      }

      document.getElementById('explanation-text').innerText = q.explanation;
      document.getElementById('explanation-box').classList.remove('hidden');
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < currentQuestions.length) {
        showQuestion();
      } else {
        finishQuiz();
      }
    }

    // 満点の派手な演出
    function triggerPerfectCelebration() {
      const celebration = document.getElementById('perfect-celebration');
      celebration.classList.remove('hidden');
      document.getElementById('result-heading').classList.add('hidden');

      // 1. 初動の特大バースト（中央から噴出）
      confetti({
        particleCount: 130,
        spread: 110,
        origin: { y: 0.6 },
        colors: ['#ffd700', '#2e7d32', '#00b0ff', '#ff3d00', '#ffffff']
      });

      // 2. 左右両端からの打ち上げキャノン（約3.5秒間持続）
      const duration = 3500;
      const end = Date.now() + duration;

      const frame = () => {
        confetti({
          particleCount: 4,
          angle: 60,
          spread: 55,
          origin: { x: 0, y: 0.75 },
          colors: ['#ffd700', '#4caf50', '#ffffff']
        });
        confetti({
          particleCount: 4,
          angle: 120,
          spread: 55,
          origin: { x: 1, y: 0.75 },
          colors: ['#ffd700', '#29b6f6', '#ffffff']
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      };
      frame();
    }

    function finishQuiz() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');
      
      document.getElementById('final-score').innerText = `${currentQuestions.length}問中 ${score}問正解！`;

      const storageKey = 'geographyQuizHighScore_Advanced';
      const currentHighScore = parseInt(localStorage.getItem(storageKey) || 0);
      const msgElement = document.getElementById('new-high-score-msg');
      
      if (score > currentHighScore) {
        localStorage.setItem(storageKey, score);
        msgElement.innerText = "🎉 ハイスコア更新！";
        msgElement.classList.remove('hidden');
      } else {
        msgElement.classList.add('hidden');
      }

      // 満点判定
      if (score === currentQuestions.length) {
        triggerPerfectCelebration();
      } else {
        document.getElementById('perfect-celebration').classList.add('hidden');
        document.getElementById('result-heading').classList.remove('hidden');
      }
    }

    function resetQuiz() {
      const storageKey = 'geographyQuizHighScore_Advanced';
      const highScore = localStorage.getItem(storageKey) || 0;
      document.getElementById('high-score-display').innerText = `過去の最高得点: ${highScore}点`;
      
      document.getElementById('perfect-celebration').classList.add('hidden');
      document.getElementById('result-heading').classList.remove('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }
  </script>
</body>
</html>
